name: Test Next.js Frontend
description: Runs Next.js frontend tests

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'

    - name: Install pnpm
      shell: bash
      run: npm install -g pnpm@10.12.4

    - name: Setup pnpm cache
      uses: actions/setup-node@v4
      with:
        node-version: '23'
        cache: 'pnpm'
        cache-dependency-path: 'src/ClercqIt.Web/pnpm-lock.yaml'

    - name: Install dependencies for main app
      shell: bash
      working-directory: ./src/ClercqIt.Web
      run: pnpm install --frozen-lockfile

    - name: Install dependencies for tests
      shell: bash
      working-directory: ./tests/ClercqIt.Web.Tests
      run: pnpm install --frozen-lockfile

    - name: Run linter
      shell: bash
      working-directory: ./src/ClercqIt.Web
      run: pnpm run lint

    - name: Build Next.js
      shell: bash
      working-directory: ./src/ClercqIt.Web
      run: |
        echo "🏗️ Building Next.js application..."
        pnpm run build
        echo "## ✅ Next.js Build Successful" >> $GITHUB_STEP_SUMMARY
        echo "- Production build completed successfully" >> $GITHUB_STEP_SUMMARY

    - name: Run frontend tests
      shell: bash
      working-directory: ./tests/ClercqIt.Web.Tests
      run: |
        echo "🧪 Running frontend tests..."
        pnpm run test --passWithNoTests
        echo "## ✅ Frontend Tests Completed" >> $GITHUB_STEP_SUMMARY
        echo "- All frontend unit tests executed" >> $GITHUB_STEP_SUMMARY
