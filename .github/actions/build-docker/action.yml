name: Build Docker Image
description: Builds and pushes Docker image to Docker Hub

inputs:
  docker-username:
    description: Docker Hub username
    required: true
  docker-password:
    description: Docker Hub password
    required: true
  registry:
    description: Docker registry
    required: true
    default: docker.io
  image-name:
    description: Docker image name
    required: true
  sem-ver:
    description: Semantic version
    required: true
  short-sha:
    description: Short commit SHA
    required: true

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      shell: bash
      run: dotnet restore

    - name: Install EF Core tools
      shell: bash
      run: dotnet tool install --global dotnet-ef --version 9.0.9

    - name: Generate migration SQL script
      shell: bash
      run: |
        echo "📝 Generating migration SQL script..."
        cd src/Clercq.It.Infrastructure
        dotnet ef migrations script --idempotent --output ../../migration.sql --startup-project ../ClercqIt.Api
        echo "✅ Migration script generated successfully"
        
    - name: Upload migration script as artifact
      uses: actions/upload-artifact@v4
      with:
        name: migration-script
        path: migration.sql
        retention-days: 30

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}

    - name: Extract metadata and set tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image-name }}
        tags: |
          type=raw,value=${{ inputs.sem-ver }}
          type=raw,value=${{ inputs.short-sha }}
          type=raw,value=latest

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ./src
        file: ./src/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: |
          ${{ steps.meta.outputs.labels }}
          org.opencontainers.image.version=${{ inputs.sem-ver }}
          org.opencontainers.image.revision=${{ inputs.short-sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate artifact attestation
      uses: actions/attest-build-provenance@v1
      with:
        subject-name: ${{ inputs.registry }}/${{ inputs.image-name }}
        subject-digest: ${{ steps.build.outputs.digest }}
        push-to-registry: true

    - name: Output build information
      shell: bash
      run: |
        echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Status**: ✅ Built and pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
        echo "- **Registry**: Docker Hub" >> $GITHUB_STEP_SUMMARY
        echo "- **Image**: \`${{ inputs.image-name }}:${{ inputs.sem-ver }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: \`${{ inputs.sem-ver }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **SHA**: \`${{ inputs.short-sha }}\`" >> $GITHUB_STEP_SUMMARY
