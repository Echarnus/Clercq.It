---
name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 8:00 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Read-only by default; the analyze jobs ask for security-events: write (#397).
permissions:
  actions: read
  contents: read

jobs:
  analyze-csharp:
    name: Analyze C# Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          queries: +security-extended,security-and-quality

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          cd src
          dotnet restore ClercqIt.Api/ClercqIt.Api.csproj --locked-mode

      - name: Build
        run: |
          cd src
          dotnet build ClercqIt.Api/ClercqIt.Api.csproj --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:csharp"

  analyze-javascript:
    name: Analyze JavaScript/TypeScript Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"

  codeql-gate:
    name: CodeQL gate
    # Fails when the analysed ref has an open high or critical CodeQL alert.
    # A false positive is dismissed in the Security tab with a reason (issue #237).
    runs-on: ubuntu-latest
    needs: [analyze-csharp, analyze-javascript]
    if: github.event_name != 'schedule'
    permissions:
      security-events: read
    steps:
      - name: Check open high and critical alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}
        run: |
          found=0
          for severity in critical high; do
            alerts=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/code-scanning/alerts?tool_name=CodeQL&state=open&severity=$severity&ref=$REF&per_page=100" \
              --jq '.[] | "\(.rule.security_severity_level // .rule.severity)  \(.rule.id)  \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)  \(.html_url)"')
            if [ -n "$alerts" ]; then
              echo "$alerts"
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::Open high or critical CodeQL alerts on $REF. Fix them, or dismiss a false positive in the Security tab with a reason."
            exit 1
          fi
          echo "No open high or critical CodeQL alerts on $REF"
