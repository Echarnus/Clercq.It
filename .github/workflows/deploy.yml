---
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version to deploy (leave empty to build and deploy latest)'
        required: false
        default: ''
        type: string
      skip-tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean
      skip-infra:
        description: 'Skip infrastructure deployment'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  IMAGE_NAME: echarnus/clercq-it

permissions:
  contents: write
  packages: write
  pull-requests: read
  id-token: write
  attestations: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip-tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test .NET API
        uses: ./.github/actions/test-dotnet

      - name: Test Next.js Frontend
        uses: ./.github/actions/test-frontend

  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: |
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      github.event.inputs.version == ''
    outputs:
      version: ${{ steps.gitversion.outputs.semVer }}
      short-sha: ${{ steps.gitversion.outputs.shortSha }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create initial version tag if none exists
        run: |
          if [ -z "$(git tag -l)" ]; then
            echo "No version tags found. Creating initial tag v1.0.0"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a v1.0.0 -m "Initial version tag for GitVersion"
            git push origin v1.0.0
          else
            echo "Version tags already exist. Skipping initial tag creation."
          fi

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v1
        id: gitversion

      - name: Build and push Docker image
        uses: ./.github/actions/build-docker
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          registry: ${{ env.REGISTRY }}
          image-name: ${{ env.IMAGE_NAME }}
          sem-ver: ${{ steps.gitversion.outputs.semVer }}
          short-sha: ${{ steps.gitversion.outputs.shortSha }}

  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [build]
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      !inputs.skip-infra
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy infrastructure
        uses: ./.github/actions/deploy-infra
        with:
          scaleway-access-key: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          scaleway-secret-key: ${{ secrets.SCALEWAY_SECRET_KEY }}
          scaleway-organization-id: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          scaleway-project-id: ${{ secrets.SCALEWAY_PROJECT_ID }}
          database-password: ${{ secrets.DATABASE_PASSWORD }}
          container-image: ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version || 'latest' }}
          custom-domain: ${{ vars.CUSTOM_DOMAIN || 'www.clercq.it' }}

  migrate-database:
    name: Migrate Database
    runs-on: ubuntu-latest
    needs: [build, deploy-infrastructure]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Migrate database
        uses: ./.github/actions/migrate-database
        with:
          scaleway-access-key: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          scaleway-secret-key: ${{ secrets.SCALEWAY_SECRET_KEY }}
          scaleway-organization-id: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          scaleway-project-id: ${{ secrets.SCALEWAY_PROJECT_ID }}
          database-password: ${{ secrets.DATABASE_PASSWORD }}

  deploy-container:
    name: Deploy Container
    runs-on: ubuntu-latest
    needs: [build, deploy-infrastructure, migrate-database]
    if: |
      always() &&
      (needs.build.result == 'success' || github.event.inputs.version != '') &&
      (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped') &&
      (needs.migrate-database.result == 'success' || needs.migrate-database.result == 'skipped')
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set deployment version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "source=manual" >> $GITHUB_OUTPUT
          else
            echo "version=${{ needs.build.outputs.version }}" >> $GITHUB_OUTPUT
            echo "source=automatic" >> $GITHUB_OUTPUT
          fi

      - name: Deploy container
        uses: ./.github/actions/deploy-container
        with:
          scaleway-access-key: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          scaleway-secret-key: ${{ secrets.SCALEWAY_SECRET_KEY }}
          scaleway-organization-id: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          image-name: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          registry: ${{ env.REGISTRY }}

      - name: Deployment summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 Deployment Details" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Source**: ${{ steps.version.outputs.source }} deployment" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment**: production" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔗 Quick Actions" >> $GITHUB_STEP_SUMMARY
            echo "- [View in Scaleway Console](https://console.scaleway.com/containers)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Troubleshooting" >> $GITHUB_STEP_SUMMARY
            echo "1. Check that Scaleway credentials are configured" >> $GITHUB_STEP_SUMMARY
            echo "2. Verify the container exists in Scaleway (enable infrastructure deployment)" >> $GITHUB_STEP_SUMMARY
            echo "3. Ensure Docker image was pushed successfully" >> $GITHUB_STEP_SUMMARY
            echo "4. Review the logs above for specific error details" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
