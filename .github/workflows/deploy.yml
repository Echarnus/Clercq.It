---
name: Deploy to Scaleway

"on":
  workflow_run:
    workflows: ["build"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version to deploy (e.g., v1.0.1, latest)'
        required: true
        default: 'latest'
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: echarnus/clercq-it
  SITE_URL: https://www.clercq.it
  SCW_CLI_VERSION: 2.40.0

permissions:
  contents: read
  actions: read

# One production deploy at a time. A newer pending run replaces an older
# pending one, so builds that finish out of order cannot roll production back.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Scaleway
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      actions: read
      issues: write  # a failed smoke test opens an issue
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-digest: ${{ steps.digest.outputs.image-digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download version artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read version from artifact
        if: github.event_name == 'workflow_run'
        id: read_version
        run: |
          if [ -f version.txt ]; then
            VERSION=$(cat version.txt)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Read version from artifact: $VERSION"
          else
            echo "Error: version.txt not found"
            exit 1
          fi

      - name: Set deployment version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "source=manual" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.read_version.outputs.version }}" >> $GITHUB_OUTPUT
            echo "source=automatic" >> $GITHUB_OUTPUT
          fi

      - name: Validate image exists
        run: |
          echo "🔍 Validating Docker image exists..."
          IMAGE_TAG="${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Checking for image $IMAGE_TAG"
            
            if docker manifest inspect "$IMAGE_TAG" > /dev/null 2>&1; then
              echo "✅ Image $IMAGE_TAG exists"
              exit 0
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "⏳ Image not found yet, waiting 10 seconds before retry..."
              sleep 10
            fi
          done
          
          echo "❌ Image $IMAGE_TAG not found after $MAX_RETRIES attempts"
          exit 1

      - name: Resolve image digest
        id: digest
        # Verify and production must run the same image, not just the same tag.
        run: |
          IMAGE_REF="${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          IMAGE_DIGEST=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' | jq -r '.digest // empty')
          if [[ "$IMAGE_DIGEST" != sha256:* ]]; then
            echo "❌ Could not resolve the digest of $IMAGE_REF"
            exit 1
          fi
          echo "📦 $IMAGE_REF is $IMAGE_DIGEST"
          echo "IMAGE_REF=$IMAGE_REF" >> $GITHUB_ENV
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> $GITHUB_ENV
          echo "image-digest=$IMAGE_DIGEST" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          echo "📦 Installing deployment dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y jq curl postgresql-client

      - name: Install Scaleway CLI
        run: |
          # Pinned, same version as the agent environment
          curl -fsSL -o /tmp/scw "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          sudo mv /tmp/scw /usr/local/bin/scw
          chmod +x /usr/local/bin/scw
          scw config set access-key=${{ secrets.SCALEWAY_ACCESS_KEY }}
          scw config set secret-key=${{ secrets.SCALEWAY_SECRET_KEY }}
          scw config set default-organization-id=${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          scw config set default-region=fr-par
          scw config set default-zone=fr-par-1

      - name: Download migration script
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'build'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: migration-script
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.17.0'
          terraform_wrapper: false

      - name: Read infrastructure outputs
        # Container IDs, database and bucket names for both environments
        # (infra/terraform/outputs.tf). Sensitive values are masked in logs.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
        run: |
          cd infra/terraform
          terraform init -input=false > /dev/null
          set_env() {
            local value
            if ! value=$(terraform output -raw "$2" 2>/dev/null) || [[ -z "$value" ]]; then
              echo "❌ Terraform output '$2' is missing. Run the infra pipeline (infra.yml) first."
              exit 1
            fi
            [[ "${3:-}" == secret ]] && echo "::add-mask::$value"
            echo "$1=$value" >> $GITHUB_ENV
          }
          set_env DB_HOST database_endpoint secret
          set_env DB_PORT database_port
          set_env DB_NAME database_name
          set_env DB_MIGRATOR_USER database_migrator_user
          set_env DB_MIGRATOR_PASSWORD database_migrator_password secret
          set_env DB_APP_USER database_app_user
          set_env DB_APP_PASSWORD database_app_password secret
          set_env PROD_BUCKET object_storage_bucket_name
          set_env PROD_CONTAINER_ID container_id
          set_env VERIFY_CONTAINER_ID verify_container_id
          set_env VERIFY_URL verify_container_url
          set_env VERIFY_DB_NAME verify_database_name
          set_env VERIFY_DB_USER verify_database_user
          set_env VERIFY_DB_PASSWORD verify_database_password secret
          set_env VERIFY_DB_APP_USER verify_database_app_user
          set_env VERIFY_DB_APP_PASSWORD verify_database_app_password secret
          set_env VERIFY_BUCKET verify_bucket_name
          set_env VERIFY_STORAGE_ACCESS_KEY verify_storage_access_key secret
          set_env VERIFY_STORAGE_SECRET_KEY verify_storage_secret_key secret
          # Every database connection uses TLS and pins the instance certificate
          # (docs/secrets.md#database-logins): psql via PGSSLMODE/PGSSLROOTCERT,
          # the content import via Database__CaCertificate.
          DB_CA_FILE="$RUNNER_TEMP/rdb-ca.pem"
          terraform output -raw database_ca_certificate > "$DB_CA_FILE"
          if ! grep -q "BEGIN CERTIFICATE" "$DB_CA_FILE"; then
            echo "❌ Terraform output 'database_ca_certificate' is not a PEM certificate."
            exit 1
          fi
          echo "PGSSLMODE=verify-ca" >> $GITHUB_ENV
          echo "PGSSLROOTCERT=$DB_CA_FILE" >> $GITHUB_ENV

      - name: Setup .NET for content import
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'build'
        uses: ./.github/actions/setup-dotnet

      - name: Build content import
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'build'
        run: dotnet build src/Clercq.It.ContentImport --configuration Release

      # ------------------------------------------------------------------
      # Verify stage (issue #243): the image runs against its own database,
      # bucket and secrets first. Any failure here leaves production untouched.
      # ------------------------------------------------------------------

      - name: "Verify: migrate database"
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'build'
        run: |
          if [ ! -f migration.sql ]; then
            echo "⚠️  Migration script not found, skipping"
            exit 0
          fi
          PGPASSWORD="$VERIFY_DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$VERIFY_DB_USER" -d "$VERIFY_DB_NAME" \
            -f migration.sql -v ON_ERROR_STOP=1
          # The runtime login gets rows-only access to the new tables (issue #416)
          PGPASSWORD="$VERIFY_DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$VERIFY_DB_USER" -d "$VERIFY_DB_NAME" \
            -v app_user="$VERIFY_DB_APP_USER" -f infra/sql/grant-app-user.sql
          echo "✅ Verify database migrated"

      - name: "Verify: import content"
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'build'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          ObjectStorage__Endpoint: https://s3.fr-par.scw.cloud
          ObjectStorage__Region: fr-par
        run: |
          export ObjectStorage__BucketName="$VERIFY_BUCKET"
          export ObjectStorage__AccessKey="$VERIFY_STORAGE_ACCESS_KEY"
          export ObjectStorage__SecretKey="$VERIFY_STORAGE_SECRET_KEY"
          export ConnectionStrings__DefaultConnection="Host=$DB_HOST;Port=$DB_PORT;SSL Mode=Require;Database=$VERIFY_DB_NAME;Username=$VERIFY_DB_APP_USER;Password=$VERIFY_DB_APP_PASSWORD"
          export Database__CaCertificate="$(cat "$PGSSLROOTCERT")"
          dotnet run --project src/Clercq.It.ContentImport --configuration Release --no-build -- content

      - name: "Verify: deploy image"
        run: .github/scripts/set-container-image.sh "${VERIFY_CONTAINER_ID##*/}" "$IMAGE_REF"

      - name: "Verify: smoke test"
        id: verify_smoke
        run: .github/scripts/smoke-test.sh "https://$VERIFY_URL" "${{ steps.version.outputs.version }}"

      # e2e (#246) and DAST (#239) run here, against https://$VERIFY_URL, once they land.

      - name: Open issue for failed verification
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          FAILURES: ${{ steps.verify_smoke.outputs.failures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: .github/scripts/open-verify-issue.sh

      # ------------------------------------------------------------------
      # Production: only reached when every verify step passed.
      # ------------------------------------------------------------------

      - name: Check the image digest is still the verified one
        id: promote
        run: |
          CURRENT=$(docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' | jq -r '.digest // empty')
          if [[ "$CURRENT" != "$IMAGE_DIGEST" ]]; then
            echo "❌ $IMAGE_REF moved from $IMAGE_DIGEST to ${CURRENT:-nothing} after verification; not promoting"
            exit 1
          fi
          echo "✅ Promoting $IMAGE_REF ($IMAGE_DIGEST) to production"
          echo "## ✅ Verified \`$IMAGE_REF\` ($IMAGE_DIGEST)" >> $GITHUB_STEP_SUMMARY

      - name: Execute database migrations
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'build'
        run: |
          if [ ! -f migration.sql ]; then
            echo "⚠️  Migration script not found, skipping"
            exit 0
          fi
          echo "📊 Migration script size: $(wc -l < migration.sql) lines"
          PGPASSWORD="$DB_MIGRATOR_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_MIGRATOR_USER" -d "$DB_NAME" \
            -f migration.sql -v ON_ERROR_STOP=1
          PGPASSWORD="$DB_MIGRATOR_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_MIGRATOR_USER" -d "$DB_NAME" \
            -v app_user="$DB_APP_USER" -f infra/sql/grant-app-user.sql
          echo "✅ Database migrations executed successfully"

      - name: Import content
        # Upserts content/**/*.md into the database and uploads their images
        # (src/Clercq.It.ContentImport, docs/content.md). Idempotent.
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.name == 'build'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          ObjectStorage__Endpoint: https://s3.fr-par.scw.cloud
          ObjectStorage__Region: fr-par
          ObjectStorage__AccessKey: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          ObjectStorage__SecretKey: ${{ secrets.SCALEWAY_SECRET_KEY }}
        run: |
          export ObjectStorage__BucketName="$PROD_BUCKET"
          export ConnectionStrings__DefaultConnection="Host=$DB_HOST;Port=$DB_PORT;SSL Mode=Require;Database=$DB_NAME;Username=$DB_APP_USER;Password=$DB_APP_PASSWORD"
          export Database__CaCertificate="$(cat "$PGSSLROOTCERT")"
          dotnet run --project src/Clercq.It.ContentImport --configuration Release --no-build -- content

      - name: Deploy to Scaleway
        run: |
          echo "🚀 Starting deployment..."
          echo "📦 Image: $IMAGE_REF ($IMAGE_DIGEST)"
          echo "🎯 Source: ${{ steps.version.outputs.source }} deployment"
          echo "🌍 Environment: production"

          # Container name is defined in Terraform IaC (infra/terraform/main.tf)
          CONTAINER_NAME="clercq-it-app"
          # Terraform returns "fr-par/<uuid>"; the scw CLI wants the bare uuid
          CONTAINER_ID="${PROD_CONTAINER_ID##*/}"
          echo "📦 Container name: $CONTAINER_NAME (from IaC)"
          echo "🆔 Container ID: $CONTAINER_ID"

          # Verify container exists by getting its details
          if SCW_ERROR=$(scw container container get "$CONTAINER_ID" --output json 2>&1 >/dev/null); then
            echo "✅ Container found: $CONTAINER_NAME (ID: $CONTAINER_ID)"

            # Remember the running image so a failed smoke test can roll back to it
            PREVIOUS_IMAGE=$(scw container container get "$CONTAINER_ID" --output json | jq -r '.registry_image // empty')
            echo "⏪ Previous image: ${PREVIOUS_IMAGE:-none}"
            echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV
            echo "PREVIOUS_IMAGE=$PREVIOUS_IMAGE" >> $GITHUB_ENV

            # Update container with new image and force a fresh instance
            .github/scripts/set-container-image.sh "$CONTAINER_ID" "$IMAGE_REF"
          else
            echo "❌ Container not found in Scaleway"
            echo "Container ID: $CONTAINER_ID"
            echo "scw: $SCW_ERROR"
            echo "This indicates infrastructure state is out of sync with Scaleway resources"
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: Container not found in Scaleway" >> $GITHUB_STEP_SUMMARY
            echo "- **Container ID**: \`$CONTAINER_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Action needed**: Re-run infrastructure pipeline to recreate container" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          CONTAINER_INFO=$(scw container container get "$CONTAINER_ID" --output json)
          CONTAINER_URL=$(echo "$CONTAINER_INFO" | jq -r '.domain_name // "Not available"')
          CONTAINER_STATUS=$(echo "$CONTAINER_INFO" | jq -r '.status // "unknown"')
          echo "✅ Deployment completed successfully!"
          echo "🌐 Container URL: https://$CONTAINER_URL"
          echo "📊 Container Status: $CONTAINER_STATUS"
          echo "CONTAINER_URL=$CONTAINER_URL" >> $GITHUB_ENV
          echo "CONTAINER_STATUS=$CONTAINER_STATUS" >> $GITHUB_ENV

      - name: Smoke test
        id: smoke
        run: .github/scripts/smoke-test.sh "$SITE_URL" "${{ steps.version.outputs.version }}"

      - name: Roll back to previous image
        if: failure() && steps.smoke.outcome == 'failure' && env.PREVIOUS_IMAGE != ''
        run: |
          echo "⏪ Smoke test failed, rolling back to $PREVIOUS_IMAGE"
          .github/scripts/set-container-image.sh "$CONTAINER_ID" "$PREVIOUS_IMAGE"
          echo "## ⏪ Rolled back to \`$PREVIOUS_IMAGE\`" >> $GITHUB_STEP_SUMMARY

      - name: Open issue for failed smoke test
        if: failure() && steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          FAILURES: ${{ steps.smoke.outputs.failures }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: .github/scripts/open-smoke-issue.sh

      - name: Update deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 Deployment Details" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Source**: ${{ steps.version.outputs.source }} deployment" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment**: production" >> $GITHUB_STEP_SUMMARY
            echo "- **Container Status**: \`${{ env.CONTAINER_STATUS }}\`" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ env.CONTAINER_URL }}" != "Not available" && -n "${{ env.CONTAINER_URL }}" ]]; then
              echo "- **URL**: https://${{ env.CONTAINER_URL }}" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔗 Quick Actions" >> $GITHUB_STEP_SUMMARY
            echo "- [View in Scaleway Console](https://console.scaleway.com/containers)" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ env.CONTAINER_URL }}" != "Not available" && -n "${{ env.CONTAINER_URL }}" ]]; then
              echo "- [Visit Application](https://${{ env.CONTAINER_URL }})" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Deployment Attempt Details" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Error**: Deployment process failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔧 Troubleshooting" >> $GITHUB_STEP_SUMMARY
            echo "1. Check that Scaleway credentials are configured" >> $GITHUB_STEP_SUMMARY
            echo "2. Verify the container exists in Scaleway (run infrastructure pipeline)" >> $GITHUB_STEP_SUMMARY
            echo "3. Ensure Docker image was pushed successfully" >> $GITHUB_STEP_SUMMARY
            echo "4. Review the logs above for specific error details" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  release:
    name: Tag production release
    runs-on: ubuntu-latest
    needs: [deploy]
    # Every automatic deploy from main gets a tag and a GitHub Release, so
    # what runs in production can be traced and rolled back (docs/versioning.md).
    if: github.event_name == 'workflow_run'
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Fetch the image's build provenance
        # build.yml signs SLSA build provenance for the image digest
        # (actions/attest-build-provenance). Attach it to the release so the
        # release itself carries signed provenance (#403, OpenSSF Scorecard
        # Signed-Releases): the DSSE envelopes as .intoto.jsonl and the full
        # Sigstore bundle, which `gh attestation verify --bundle` checks.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.deploy.outputs.version }}
          IMAGE_DIGEST: ${{ needs.deploy.outputs.image-digest }}
        run: |
          # Production is already live here, so a missing attestation only
          # warns: the release and its tag still get created, without assets.
          mkdir -p provenance
          if ! gh api "repos/${GITHUB_REPOSITORY}/attestations/${IMAGE_DIGEST}" \
            --jq '[.attestations[].bundle | select(.dsseEnvelope.payloadType == "application/vnd.in-toto+json")]' \
            > bundles.json || [ "$(jq length bundles.json)" -eq 0 ]; then
            echo "::warning::No build provenance found for ${IMAGE_DIGEST}; the release gets no provenance assets"
            exit 0
          fi
          jq -c '.[].dsseEnvelope' bundles.json > "provenance/clercq-it-${VERSION}.intoto.jsonl"
          jq '.[0]' bundles.json > "provenance/clercq-it-${VERSION}.sigstore.json"
          ls -l provenance

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.deploy.outputs.version }}
          IMAGE_DIGEST: ${{ needs.deploy.outputs.image-digest }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The tag uses a "prod-" prefix so GitVersion ignores it; a plain
          # v-tag would reset the commit-count based patch number.
          TAG="prod-${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          # shellcheck disable=SC2046 # no assets when the folder is empty
          gh release create "$TAG" $(find provenance -type f) \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "$VERSION" \
            --notes "Image: \`docker.io/echarnus/clercq-it@${IMAGE_DIGEST}\`" \
            --generate-notes
          echo "## 🏷️ Released ${VERSION} (tag ${TAG})" >> $GITHUB_STEP_SUMMARY
