---
name: Deploy to Scaleway

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version to deploy'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: echarnus/clercq-it

jobs:
  deploy:
    name: Deploy to Scaleway
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v1
        id: gitversion

      - name: Set deployment version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> \
              $GITHUB_OUTPUT
          else
            echo "version=${{ steps.gitversion.outputs.semVer }}" >> \
              $GITHUB_OUTPUT
          fi

      - name: Deploy to Scaleway
        env:
          SCALEWAY_IP: ${{ secrets.SCALEWAY_IP }}
          SCALEWAY_USER: ${{ secrets.SCALEWAY_USER }}
          SSH_KEY_PATH: /tmp/scaleway_key
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          DOCKER_IMAGE: ${{ env.IMAGE_NAME }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Create SSH key file
          echo "${{ secrets.SCALEWAY_SSH_KEY }}" > /tmp/scaleway_key
          chmod 600 /tmp/scaleway_key
          
          # Run deployment script
          ./infra/scaleway/deploy.sh

      - name: Update deployment status
        if: always()
        run: |
          if [ ${{ job.status }} = "success" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
            exit 1
          fi

  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
