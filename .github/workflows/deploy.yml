---
name: Deploy

"on":
  push:
    branches: [main, 'release/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version to deploy (e.g., v1.0.1, latest)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: echarnus/clercq-it

permissions:
  contents: read
  packages: write
  pull-requests: read
  id-token: write
  attestations: write

jobs:
  # Step 1: Build the application
  build:
    name: Build Application
    uses: ./.github/workflows/build.yml

  # Step 2: Check for infrastructure changes
  check-infra-changes:
    name: Check Infrastructure Changes
    runs-on: ubuntu-latest
    outputs:
      infra-changed: ${{ steps.changes.outputs.infra }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for infrastructure changes
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^infra/'; then
            echo "infra=true" >> $GITHUB_OUTPUT
            echo "Infrastructure files changed"
          else
            echo "infra=false" >> $GITHUB_OUTPUT
            echo "No infrastructure files changed"
          fi

  # Step 3: Validate infrastructure (always runs)
  validate-infra:
    name: Validate Infrastructure
    needs: [check-infra-changes]
    uses: ./.github/workflows/infra.yml

  # Step 4: Deploy infrastructure (only if changes occurred)
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [build, validate-infra, check-infra-changes]
    if: needs.check-infra-changes.outputs.infra-changed == 'true'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Terraform Init
        run: |
          cd infra/terraform
          terraform init \
            -backend-config="access_key=$SCW_ACCESS_KEY" \
            -backend-config="secret_key=$SCW_SECRET_KEY"
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1
          TF_VAR_scaleway_organization_id: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          TF_VAR_scaleway_project_id: ${{ secrets.SCALEWAY_PROJECT_ID }}

      - name: Terraform Apply
        run: |
          cd infra/terraform
          echo "🚀 Starting infrastructure deployment..."
          terraform apply -auto-approve -no-color
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1
          TF_VAR_scaleway_organization_id: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          TF_VAR_scaleway_project_id: ${{ secrets.SCALEWAY_PROJECT_ID }}
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE || 'echarnus/clercq-it:latest' }}
          TF_VAR_custom_domain: ${{ vars.CUSTOM_DOMAIN || '' }}
          TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}

      - name: Terraform Output
        if: success()
        run: |
          cd infra/terraform
          echo "## 🎉 Infrastructure Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outputs:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          terraform output -json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Step 5: Deploy application (runs after deploy-infra, even if skipped)
  deploy-app:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [build, deploy-infra]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        if: github.event_name != 'workflow_dispatch' || inputs.version == ''
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine Version
        if: github.event_name != 'workflow_dispatch' || inputs.version == ''
        uses: gittools/actions/gitversion/execute@v1
        id: gitversion

      - name: Set deployment version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "source=manual" >> $GITHUB_OUTPUT
          else
            echo "version=${{ needs.build.outputs.version }}" >> $GITHUB_OUTPUT
            echo "source=automatic" >> $GITHUB_OUTPUT
          fi

      - name: Validate image exists
        run: |
          echo "🔍 Validating Docker image exists..."
          docker manifest inspect ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "✅ Image ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} exists"
          else
            echo "❌ Image ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} not found"
            exit 1
          fi

      - name: Install dependencies
        run: |
          echo "📦 Installing deployment dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y jq curl

      - name: Deploy to Scaleway
        run: |
          echo "🚀 Starting deployment..."
          echo "📦 Image: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          echo "🎯 Source: ${{ steps.version.outputs.source }} deployment"
          echo "🌍 Environment: production"
          
          # Check if Scaleway credentials are available
          if [[ -z "${{ secrets.SCALEWAY_ACCESS_KEY }}" || -z "${{ secrets.SCALEWAY_SECRET_KEY }}" || -z "${{ secrets.SCALEWAY_ORGANIZATION_ID }}" ]]; then
            echo "❌ Scaleway credentials not found"
            echo "Please configure SCALEWAY_ACCESS_KEY, SCALEWAY_SECRET_KEY, and SCALEWAY_ORGANIZATION_ID secrets"
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Reason**: Missing Scaleway credentials" >> $GITHUB_STEP_SUMMARY
            echo "- **Required secrets**: SCALEWAY_ACCESS_KEY, SCALEWAY_SECRET_KEY, SCALEWAY_ORGANIZATION_ID" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          # Install Scaleway CLI
          echo "⬇️ Installing Scaleway CLI..."
          curl -o /tmp/scw https://github.com/scaleway/scaleway-cli/releases/latest/download/scw-linux-x86_64
          sudo mv /tmp/scw /usr/local/bin/scw
          chmod +x /usr/local/bin/scw
          
          # Configure Scaleway CLI
          echo "🔧 Configuring Scaleway CLI..."
          scw config set access-key=${{ secrets.SCALEWAY_ACCESS_KEY }}
          scw config set secret-key=${{ secrets.SCALEWAY_SECRET_KEY }}
          scw config set default-organization-id=${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          scw config set default-region=fr-par
          scw config set default-zone=fr-par-1
          
          # Get container information
          echo "🔍 Looking for existing container deployment..."
          CONTAINER_NAME="clercq-it"
          
          # Check if container exists
          if scw container container list name=$CONTAINER_NAME --output json | jq -e '.[0]' > /dev/null 2>&1; then
            echo "📦 Found existing container: $CONTAINER_NAME"
            
            # Update container with new image
            echo "🔄 Updating container with new image..."
            scw container container update \
              name=$CONTAINER_NAME \
              registry-image=${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
              --wait
            
            # Deploy the updated container
            echo "🚀 Deploying updated container..."
            scw container container deploy name=$CONTAINER_NAME --wait
            
          else
            echo "📦 Container not found. This may be the first deployment or container name mismatch."
            echo "Please ensure the container is created via Terraform infrastructure pipeline first."
            echo "## ⚠️ Deployment Notice" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: Container not found" >> $GITHUB_STEP_SUMMARY
            echo "- **Action needed**: Run infrastructure pipeline to create container" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          # Get deployment info
          echo "📊 Getting deployment information..."
          CONTAINER_INFO=$(scw container container list name=$CONTAINER_NAME --output json | jq -r '.[0]')
          CONTAINER_URL=$(echo "$CONTAINER_INFO" | jq -r '.domain_name // "Not available"')
          CONTAINER_STATUS=$(echo "$CONTAINER_INFO" | jq -r '.status // "unknown"')
          
          echo "✅ Deployment completed successfully!"
          echo "🌐 Container URL: https://$CONTAINER_URL"
          echo "📊 Container Status: $CONTAINER_STATUS"
          
          # Store deployment info for health check
          echo "CONTAINER_URL=$CONTAINER_URL" >> $GITHUB_ENV
          echo "CONTAINER_STATUS=$CONTAINER_STATUS" >> $GITHUB_ENV

      - name: Post-deployment health check
        run: |
          echo "🏥 Running post-deployment health checks..."
          
          if [[ "$CONTAINER_URL" != "Not available" && -n "$CONTAINER_URL" ]]; then
            echo "🔍 Testing container endpoint: https://$CONTAINER_URL"
            
            # Wait a moment for container to be ready
            echo "⏳ Waiting for container to be ready..."
            sleep 10
            
            # Test container health
            MAX_RETRIES=5
            RETRY_COUNT=0
            HEALTH_CHECK_PASSED=false
            
            while [[ $RETRY_COUNT -lt $MAX_RETRIES ]]; do
              echo "🔄 Health check attempt $((RETRY_COUNT + 1))/$MAX_RETRIES"
              
              if curl -f -s --max-time 30 "https://$CONTAINER_URL" > /dev/null; then
                echo "✅ Container is responding"
                HEALTH_CHECK_PASSED=true
                break
              else
                echo "⚠️ Container not responding yet..."
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [[ $RETRY_COUNT -lt $MAX_RETRIES ]]; then
                  echo "⏳ Waiting 15 seconds before retry..."
                  sleep 15
                fi
              fi
            done
            
            if [[ "$HEALTH_CHECK_PASSED" == "true" ]]; then
              echo "✅ Health checks passed"
            else
              echo "⚠️ Health checks failed after $MAX_RETRIES attempts"
              echo "Container may still be starting up. Check Scaleway console for details."
            fi
          else
            echo "⚠️ Container URL not available, skipping endpoint health check"
            echo "✅ Deployment completed (health check skipped)"
          fi

      - name: Update deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📊 Deployment Details" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Source**: ${{ steps.version.outputs.source }} deployment" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment**: production" >> $GITHUB_STEP_SUMMARY
            echo "- **Container Status**: \`${{ env.CONTAINER_STATUS }}\`" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ env.CONTAINER_URL }}" != "Not available" && -n "${{ env.CONTAINER_URL }}" ]]; then
              echo "- **URL**: https://${{ env.CONTAINER_URL }}" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔗 Quick Actions" >> $GITHUB_STEP_SUMMARY
            echo "- [View in Scaleway Console](https://console.scaleway.com/containers)" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ env.CONTAINER_URL }}" != "Not available" && -n "${{ env.CONTAINER_URL }}" ]]; then
              echo "- [Visit Application](https://${{ env.CONTAINER_URL }})" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 📋 Deployment Attempt Details" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Error**: Deployment process failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔧 Troubleshooting" >> $GITHUB_STEP_SUMMARY
            echo "1. Check that Scaleway credentials are configured" >> $GITHUB_STEP_SUMMARY
            echo "2. Verify the container exists in Scaleway (run infrastructure pipeline)" >> $GITHUB_STEP_SUMMARY
            echo "3. Ensure Docker image was pushed successfully" >> $GITHUB_STEP_SUMMARY
            echo "4. Review the logs above for specific error details" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
