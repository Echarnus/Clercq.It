---
name: Deploy to Scaleway

"on":
  workflow_run:
    workflows: ["Build and Push Docker Image", "Deploy Infra"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version to deploy (e.g., v1.0.1, latest)'
        required: true
        default: 'latest'
        type: string

env:
  REGISTRY: docker.io
  IMAGE_NAME: echarnus/clercq-it

jobs:
  deploy:
    name: Deploy to Scaleway
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        if: github.event_name == 'workflow_run'
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine Version
        if: github.event_name == 'workflow_run'
        uses: gittools/actions/gitversion/execute@v1
        id: gitversion

      - name: Set deployment version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "source=manual" >> $GITHUB_OUTPUT
          else
            echo "version=${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
            echo "source=automatic" >> $GITHUB_OUTPUT
          fi

      - name: Validate image exists
        run: |
          echo "🔍 Validating Docker image exists..."
          docker manifest inspect ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "✅ Image ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} exists"
          else
            echo "❌ Image ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} not found"
            exit 1
          fi

      - name: Deploy to Scaleway
        run: |
          echo "🚀 Starting deployment..."
          echo "📦 Image: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          echo "🎯 Source: ${{ steps.version.outputs.source }} deployment"
          echo "🌍 Environment: production"
          
          # TODO: Replace with actual Scaleway deployment commands
          # Example implementation:
          
          # 1. Install Scaleway CLI or use API calls
          # curl -o /tmp/scw https://github.com/scaleway/scaleway-cli/releases/latest/download/scw-linux-x86_64
          # sudo mv /tmp/scw /usr/local/bin/scw
          # chmod +x /usr/local/bin/scw
          # scw config set access-key=${{ secrets.SCALEWAY_ACCESS_KEY }}
          # scw config set secret-key=${{ secrets.SCALEWAY_SECRET_KEY }}
          # scw config set default-organization-id=${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          
          # 2. Update container with new image
          # scw container container update \
          #   name=clercq-it \
          #   registry-image=${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          
          # 3. Deploy the updated container
          # scw container container deploy name=clercq-it
          
          # For now, simulate deployment
          echo "⏳ Simulating deployment steps..."
          sleep 2
          echo "🔄 Updating container configuration..."
          sleep 2
          echo "📦 Pulling image ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}..."
          sleep 2
          echo "🌟 Starting new container instance..."
          sleep 2
          
          echo "✅ Deployment completed successfully!"

      - name: Post-deployment health check
        run: |
          echo "🏥 Running post-deployment health checks..."
          
          # TODO: Add actual health checks
          # curl -f https://your-domain.com/health || exit 1
          
          echo "✅ Health checks passed"

      - name: Update deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Source**: ${{ steps.version.outputs.source }} deployment" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment**: production" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "- **Version**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Error**: Deployment process failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
