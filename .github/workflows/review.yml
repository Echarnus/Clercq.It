---
name: Agent review

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Reviewer agent
    runs-on: ubuntu-latest
    # Dependabot PRs get no repository secrets; they are reviewed separately.
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when no reviewer key is configured
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::ANTHROPIC_API_KEY is not set, so no agent review ran. See docs/contributing.md."

      - name: Checkout repository
        if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review pull request
        if: env.HAS_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the reviewer for pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Nothing reaches production without your approval and there is no human review, so be strict.

            1. Read CLAUDE.md and docs/contributing.md for the rules.
            2. Read the PR with `gh pr view` and `gh pr diff`, and the linked issue (`Closes #N`) with `gh issue view`.
            3. Check, in this order:
               - The change does what the linked issue asks and meets its acceptance criteria.
               - Correctness, security (no secrets in code, no disabled security checks), and that tests cover the change.
               - Docs: every behaviour, config, infra, pipeline or workflow change is reflected under docs/ (or CLAUDE.md/README.md),
                 and the docs do not contradict the code. Missing or wrong docs is a reason to request changes.
               - The PR stays within the issue's scope.
            4. Leave inline comments for specific problems.
            5. Finish with exactly one of:
               - `gh pr review ${{ github.event.pull_request.number }} --approve --body "<short summary>"` when everything above holds.
               - `gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<what must change>"` otherwise.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr review:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),mcp__github_inline_comment__create_inline_comment"
