---
name: build

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from (if not main)'
        required: false
        default: ''
  release:
    types: [published]

env:
  REGISTRY: docker.io
  IMAGE_NAME: echarnus/clercq-it

jobs:
  test-dotnet:
    name: Test .NET API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET Aspire workload
        run: dotnet workload install aspire

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v1
        id: gitversion

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test .NET projects from /tests/
        run: |
          dotnet test --no-build --configuration Release --verbosity normal \
            --collect:"XPlat Code Coverage" --results-directory ./coverage

  test-frontend:
    name: Test Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Install pnpm
        run: npm install -g pnpm@10.12.4

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'
          cache-dependency-path: 'src/ClercqIt.Web/pnpm-lock.yaml'

      - name: Install dependencies for main app
        working-directory: ./src/ClercqIt.Web
        run: pnpm install --frozen-lockfile

      - name: Install dependencies for tests
        working-directory: ./tests/ClercqIt.Web.Tests
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: ./src/ClercqIt.Web
        run: pnpm run lint

      - name: Build Next.js
        working-directory: ./src/ClercqIt.Web
        run: pnpm run build

      - name: Run frontend tests
        working-directory: ./tests/ClercqIt.Web.Tests
        run: pnpm run test --passWithNoTests

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test-dotnet, test-frontend]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v1
        id: gitversion

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata and set tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.gitversion.outputs.semVer }}
            type=raw,value=${{ steps.gitversion.outputs.shortSha }}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{
              steps.gitversion.outputs.semVer }}
            org.opencontainers.image.revision=${{
              steps.gitversion.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Output build information
        run: |
          echo "🎉 Docker image built and pushed successfully!"
          echo "📦 Image: ${{ env.IMAGE_NAME }}:${{ steps.gitversion.outputs.semVer }}"
          echo "🏷️ Version: ${{ steps.gitversion.outputs.semVer }}"
          echo "🔖 Tags: ${{ steps.meta.outputs.tags }}"
