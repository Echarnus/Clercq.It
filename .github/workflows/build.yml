---
name: build

"on":
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from (if not main)'
        required: false
        default: ''
  release:
    types: [published]

env:
  REGISTRY: docker.io
  IMAGE_NAME: echarnus/clercq-it

permissions:
  contents: write
  packages: write
  pull-requests: read
  id-token: write
  attestations: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create initial version tag if none exists
        run: |
          if [ -z "$(git tag -l)" ]; then
            echo "No version tags found. Creating initial tag v1.0.0"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a v1.0.0 -m "Initial version tag for GitVersion"
            git push origin v1.0.0
          else
            echo "Version tags already exist. Skipping initial tag creation."
          fi

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v1
        id: gitversion

      - name: Calculate commit-based version
        id: version
        uses: ./.github/actions/calculate-version
        with:
          major: ${{ steps.gitversion.outputs.major }}
          minor: ${{ steps.gitversion.outputs.minor }}
          commits-since-version-source: ${{ steps.gitversion.outputs.commitsSinceVersionSource }}
          branch-name: ${{ github.ref_name }}
          pre-release-label: ${{ steps.gitversion.outputs.preReleaseLabel }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies (excluding Aspire projects)
        run: |
          echo "📦 Restoring dependencies for production projects..."
          cd src
          dotnet restore ClercqIt.Api/ClercqIt.Api.csproj
          echo "✅ Dependencies restored successfully"

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.0.9

      - name: Generate migration SQL script
        run: |
          echo "📝 Generating migration SQL script..."
          cd src/Clercq.It.Infrastructure
          dotnet ef migrations script --idempotent --output ../../migration.sql --startup-project ../ClercqIt.Api
          echo "✅ Migration script generated successfully"
          
      - name: Upload migration script as artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-script
          path: migration.sql
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata and set tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.gitversion.outputs.shortSha }}
            type=raw,value=latest

      - name: Save version to file
        run: |
          echo "${{ steps.version.outputs.version }}" > version.txt
          echo "Saved version ${{ steps.version.outputs.version }} to version.txt"

      - name: Upload version artifact
        uses: actions/upload-artifact@v4
        with:
          name: version
          path: version.txt
          retention-days: 1

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{
              steps.version.outputs.version }}
            org.opencontainers.image.revision=${{
              steps.gitversion.outputs.sha }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            GIT_SHA=${{ steps.gitversion.outputs.shortSha }}
            BUILD_DATE=${{ steps.gitversion.outputs.commitDate }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Run Trivy vulnerability scanner on built image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true

      - name: Output build information
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Built and pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA**: \`${{ steps.gitversion.outputs.shortSha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Security**: ✅ Vulnerability scan completed" >> $GITHUB_STEP_SUMMARY
