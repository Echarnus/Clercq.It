---
name: Test

"on":
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-dotnet:
    name: Test .NET API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: '6.8.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        id: gitversion

      # Clercq.It.CI.slnf is the solution without the Aspire AppHost
      - name: Restore dependencies (excluding Aspire projects)
        run: dotnet restore Clercq.It.CI.slnf --locked-mode

      - name: Check formatting and code style
        run: |
          if ! dotnet format Clercq.It.CI.slnf --verify-no-changes --no-restore; then
            echo "::error::Code is not formatted. Run 'dotnet format Clercq.It.CI.slnf' and commit the result."
            exit 1
          fi

      # Release builds treat warnings (analyzers, code style, nullable) as errors; see Directory.Build.props
      - name: Build
        run: |
          dotnet build Clercq.It.CI.slnf --no-restore --configuration Release
          echo "## ✅ .NET Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Built production and test projects in Release configuration, warnings as errors" >> $GITHUB_STEP_SUMMARY

      - name: Unit tests
        run: |
          dotnet test Clercq.It.CI.slnf --no-build --configuration Release \
            --filter "FullyQualifiedName!~ClercqIt.Api.Tests" \
            --collect:"XPlat Code Coverage" --results-directory ./coverage

      # Real PostgreSQL and Keycloak in containers via Testcontainers (issue #244, docs/testing.md#api-integration-tests)
      - name: API integration tests
        run: |
          dotnet test tests/ClercqIt.Api.Tests --no-build --configuration Release \
            --collect:"XPlat Code Coverage" --results-directory ./coverage
          echo "## ✅ .NET Tests Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Unit tests and API integration tests (Postgres + Keycloak containers) passed" >> $GITHUB_STEP_SUMMARY

      # Fails below tests/coverage-thresholds.json (issue #242, docs/testing.md#coverage)
      - name: Coverage gate
        run: |
          dotnet tool restore
          dotnet tool run reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:./coverage/report \
            -reporttypes:"JsonSummary;Html"
          python3 .github/scripts/check_coverage.py ./coverage/report/Summary.json tests/coverage-thresholds.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ./coverage/report
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ./coverage
          fail_ci_if_error: false

      - name: Check for known vulnerabilities in dependencies
        run: |
          echo "🔍 Checking for vulnerable packages..."
          cd src
          dotnet list ClercqIt.Api/ClercqIt.Api.csproj package --vulnerable --include-transitive || true
          echo "## 🔒 Security Check Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Checked for known vulnerabilities in dependencies" >> $GITHUB_STEP_SUMMARY

  test-frontend:
    name: Test Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install pnpm
        # Corepack installs the pnpm version (and checks the hash) named in packageManager.
        # Also make it the global default: setup-node's pnpm cache asks for the store
        # path from the repo root, where no packageManager applies.
        run: |
          corepack enable
          corepack install --global "$(jq -r .packageManager src/ClercqIt.Web/package.json)"

      - name: Setup pnpm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'src/ClercqIt.Web/pnpm-lock.yaml'

      - name: Install dependencies for main app
        working-directory: ./src/ClercqIt.Web
        run: pnpm install --frozen-lockfile

      # Lint, format and type checks block the PR (issue #240, docs/development.md#frontend-lint-format-and-types)
      - name: Lint (ESLint, no warnings allowed)
        working-directory: ./src/ClercqIt.Web
        run: pnpm run lint

      - name: Format check (Prettier)
        working-directory: ./src/ClercqIt.Web
        run: pnpm run format:check

      - name: Type check
        working-directory: ./src/ClercqIt.Web
        run: pnpm run typecheck

      - name: Build Next.js
        working-directory: ./src/ClercqIt.Web
        run: |
          echo "🏗️ Building Next.js application..."
          pnpm run build
          echo "## ✅ Next.js Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Production build completed successfully" >> $GITHUB_STEP_SUMMARY

      # What an anonymous visitor downloads holds no admin code, no source maps ship,
      # and /admin/dashboard only redirects (issue #454, docs/application-security.md#admin-pages)
      - name: Public bundle check (no admin code for visitors)
        working-directory: ./src/ClercqIt.Web
        run: pnpm run check:public-bundle

      # Vitest unit and component tests with the coverage gate in vitest.config.mts (issue #246, docs/testing.md)
      - name: Unit tests with coverage gate (Vitest)
        working-directory: ./src/ClercqIt.Web
        run: pnpm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: src/ClercqIt.Web/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Run npm security audit
        working-directory: ./src/ClercqIt.Web
        run: |
          echo "🔍 Running security audit on npm packages..."
          pnpm audit --audit-level=high
          echo "## 🔒 Security Audit Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Checked for known vulnerabilities in npm packages" >> $GITHUB_STEP_SUMMARY

  docker-build:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest
    # On pull requests only: catches Dockerfile failures before they reach main.
    # build.yml builds and pushes the real image after merge.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=0.0.0-pr
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  container-test:
    name: Container smoke test
    runs-on: ubuntu-latest
    # On pull requests only: runs the production image the way Scaleway does,
    # against a throwaway Postgres, so a container that crashes at startup
    # fails the PR (issue #439; the libicu crash in 1.0.247-1.0.252 only
    # showed after merge). ZAP (#239) and e2e (#246) run against the same
    # container, after the smoke test step.
    if: github.event_name == 'pull_request'
    env:
      IMAGE: clercq-it:ci
      VERSION: 0.0.0-ci
      DB_CONNECTION: Host=localhost;Port=5432;Database=clercqit_ci;Username=clercqit_user;Password=ci-only-password
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clercqit_ci
          POSTGRES_USER: clercqit_user
          POSTGRES_PASSWORD: ci-only-password # throwaway CI database, not a secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clercqit_user -d clercqit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=${{ env.VERSION }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      # Same steps as deploy.yml: the idempotent migration script through psql,
      # then the content import (content/**/*.md has no images, so no bucket).
      - name: Migrate database
        run: |
          dotnet restore src/ClercqIt.Api/ClercqIt.Api.csproj --locked-mode
          dotnet tool install --global dotnet-ef --version 10.0.13
          cd src/Clercq.It.Infrastructure
          dotnet ef migrations script --idempotent --output ../../migration.sql --startup-project ../ClercqIt.Api
          cd ../..
          PGPASSWORD=ci-only-password psql -h localhost -U clercqit_user -d clercqit_ci \
            -f migration.sql -v ON_ERROR_STOP=1 -q

      - name: Import content
        env:
          ConnectionStrings__DefaultConnection: ${{ env.DB_CONNECTION }}
        run: dotnet run --project src/Clercq.It.ContentImport --configuration Release -- content

      - name: Start container
        # Host networking: the container reaches the Postgres service on
        # localhost, nginx's [::]:80 listener has IPv6, and the site is on
        # http://localhost. Keycloak only needs a URL to start; the smoke test
        # does not sign in.
        run: |
          docker run -d --name clercq-it --network host \
            -e ConnectionStrings__DefaultConnection="$DB_CONNECTION" \
            -e Keycloak__BaseUrl=https://keycloak.invalid \
            -e Keycloak__Realm=clercqit \
            -e Keycloak__ClientId=clercqit-web \
            "$IMAGE"
          # Fail fast when start.sh exits (a crashing API or frontend), else
          # wait until nginx serves the home page.
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' clercq-it)" != "true" ]; then
              echo "::error::The container stopped during startup"
              exit 1
            fi
            if curl -fs -o /dev/null --max-time 5 http://localhost/; then
              echo "Container is serving after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::The container did not serve http://localhost/ within 120s"
          exit 1

      - name: Smoke test
        env:
          SMOKE_ATTEMPTS: 6
          SMOKE_DELAY: 5
        run: .github/scripts/smoke-test.sh http://localhost "$VERSION"

      # The scheduled jobs ship in the same image (docs/jobs.md). Run one the way a Scaleway
      # job does, against the CI database (the container's own connection string), and check
      # that a wrong name is refused with exit code 2.
      - name: Scheduled job runs from the image
        run: |
          job() {
            docker exec -e FeatureFlags__MyZen=true -e MyZen__SessionKey=ci-only-session-key clercq-it \
              /usr/share/dotnet/dotnet /app/api/Clercq.It.Jobs.dll "$1"
          }
          out=$(job myzen-keepalive 2>&1) || { echo "$out"; echo "::error::myzen-keepalive failed"; exit 1; }
          echo "$out"
          grep -q "no live MyZen session" <<< "$out" || { echo "::error::myzen-keepalive did not report an empty session table"; exit 1; }
          code=0
          job no-such-job > /dev/null 2>&1 || code=$?
          [ "$code" = 2 ] || { echo "::error::an unknown job exited with $code, expected 2"; exit 1; }

      # The real image keeps the admin closed to visitors (issue #454): the dashboard
      # redirects to the sign-in page, and admin-only API answers 401 without a token.
      - name: Admin closed to anonymous visitors
        run: |
          failed=0
          expect() {
            local want="$1" path="$2" got
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://localhost$path")
            if [ "$got" = "$want" ]; then echo "$path: $got"; else echo "::error::$path: expected $want, got $got"; failed=1; fi
          }
          expect 307 /admin/dashboard
          expect 307 /admin/dashboard/blogs
          expect 401 /api/features
          expect 401 /api/auth/session
          expect 401 /api/stats
          expect 401 /api/myzen/session
          location=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost/admin/dashboard)
          case "$location" in
            */admin) echo "redirect: $location" ;;
            *) echo "::error::/admin/dashboard redirects to '$location', expected /admin"; failed=1 ;;
          esac
          exit "$failed"

      # ZAP baseline scan (#239) and Playwright e2e (#246) go here, against http://localhost.

      - name: Container logs
        if: failure()
        run: |
          docker ps -a
          docker logs clercq-it || true
          echo "--- /var/log/api.log"; docker exec clercq-it cat /var/log/api.log || true
          echo "--- /var/log/frontend.log"; docker exec clercq-it cat /var/log/frontend.log || true

  deploy-scripts:
    name: Test deploy scripts
    runs-on: ubuntu-latest
    # Smoke test and rollback scripts used by deploy.yml (issue #232),
    # PR conventions and repository audit scripts (issue #245)
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Smoke test script
        run: bash .github/scripts/tests/smoke-test.test.sh

      - name: Rollback on failed smoke test
        run: bash .github/scripts/tests/rollback.test.sh

      - name: Scheduled job image update
        run: bash .github/scripts/tests/set-job-image.test.sh

      - name: PR conventions check
        run: bash .github/scripts/tests/check-pr-conventions.test.sh

      - name: Repository audit and coverage gate scripts
        run: python3 -m unittest discover -s .github/scripts/tests -v
