---
name: Test

"on":
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  test-dotnet:
    name: Test .NET API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v1
        with:
          versionSpec: '6.0.x'

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v1
        id: gitversion

      # Clercq.It.CI.slnf is the solution without the Aspire AppHost
      - name: Restore dependencies (excluding Aspire projects)
        run: dotnet restore Clercq.It.CI.slnf

      - name: Check formatting and code style
        run: |
          if ! dotnet format Clercq.It.CI.slnf --verify-no-changes --no-restore; then
            echo "::error::Code is not formatted. Run 'dotnet format Clercq.It.CI.slnf' and commit the result."
            exit 1
          fi

      # Release builds treat warnings (analyzers, code style, nullable) as errors; see Directory.Build.props
      - name: Build
        run: |
          dotnet build Clercq.It.CI.slnf --no-restore --configuration Release
          echo "## ✅ .NET Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Built production and test projects in Release configuration, warnings as errors" >> $GITHUB_STEP_SUMMARY

      - name: Test .NET projects from /tests/
        run: |
          echo "🧪 Running .NET tests..."
          dotnet test Clercq.It.CI.slnf --no-build --configuration Release --verbosity normal \
            --collect:"XPlat Code Coverage" --results-directory ./coverage
          echo "## ✅ .NET Tests Completed" >> $GITHUB_STEP_SUMMARY
          echo "- All .NET unit and integration tests executed" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./coverage
          fail_ci_if_error: false

      - name: Check for known vulnerabilities in dependencies
        run: |
          echo "🔍 Checking for vulnerable packages..."
          cd src
          dotnet list ClercqIt.Api/ClercqIt.Api.csproj package --vulnerable --include-transitive || true
          echo "## 🔒 Security Check Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Checked for known vulnerabilities in dependencies" >> $GITHUB_STEP_SUMMARY

  test-frontend:
    name: Test Next.js Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'

      - name: Install pnpm
        run: npm install -g pnpm@10.12.4

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'pnpm'
          cache-dependency-path: 'src/ClercqIt.Web/pnpm-lock.yaml'

      - name: Install dependencies for main app
        working-directory: ./src/ClercqIt.Web
        run: pnpm install --frozen-lockfile

      - name: Install dependencies for tests
        working-directory: ./tests/ClercqIt.Web.Tests
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: ./src/ClercqIt.Web
        run: pnpm run lint

      - name: Build Next.js
        working-directory: ./src/ClercqIt.Web
        run: |
          echo "🏗️ Building Next.js application..."
          pnpm run build
          echo "## ✅ Next.js Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "- Production build completed successfully" >> $GITHUB_STEP_SUMMARY

      - name: Run frontend tests
        working-directory: ./tests/ClercqIt.Web.Tests
        run: |
          echo "🧪 Running frontend tests..."
          pnpm run test --passWithNoTests
          echo "## ✅ Frontend Tests Completed" >> $GITHUB_STEP_SUMMARY
          echo "- All frontend unit tests executed" >> $GITHUB_STEP_SUMMARY

      - name: Run npm security audit
        working-directory: ./src/ClercqIt.Web
        run: |
          echo "🔍 Running security audit on npm packages..."
          pnpm audit --audit-level=high || echo "⚠️ Vulnerabilities found - review required"
          echo "## 🔒 Security Audit Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Checked for known vulnerabilities in npm packages" >> $GITHUB_STEP_SUMMARY

  docker-build:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest
    # On pull requests only: catches Dockerfile failures before they reach main.
    # build.yml builds and pushes the real image after merge.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=0.0.0-pr
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  deploy-scripts:
    name: Test deploy scripts
    runs-on: ubuntu-latest
    # Smoke test and rollback scripts used by deploy.yml (issue #232),
    # PR conventions and repository audit scripts (issue #245)
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Smoke test script
        run: bash .github/scripts/tests/smoke-test.test.sh

      - name: Rollback on failed smoke test
        run: bash .github/scripts/tests/rollback.test.sh

      - name: PR conventions check
        run: bash .github/scripts/tests/check-pr-conventions.test.sh

      - name: Repository audit
        run: python3 -m unittest discover -s .github/scripts/tests -v
