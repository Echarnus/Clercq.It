---
name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

# Read-only by default; the Trivy jobs ask for security-events: write to upload SARIF (#397).
permissions:
  contents: read

jobs:
  trivy-container-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    # Blocking (issue #281): a failed image build or a fixable HIGH/CRITICAL
    # finding fails the job. Reasoned exceptions live in .trivyignore.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Docker image for scanning
        run: docker build -t clercq-it:scan ./src

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'clercq-it:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-container'

      - name: Run Trivy with table output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'clercq-it:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

  trivy-filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'

      # Blocking (issue #281): fixable HIGH/CRITICAL findings in lockfiles,
      # Dockerfile and Terraform fail the job.
      - name: Fail on HIGH or CRITICAL filesystem findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

  dotnet-security-scan:
    name: .NET Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore dependencies
        run: dotnet restore Clercq.It.CI.slnf --locked-mode

      - name: Check for vulnerable packages
        # Blocking on High and Critical (issue #237); Low and Moderate are listed only.
        run: |
          dotnet list Clercq.It.CI.slnf package --vulnerable --include-transitive --format json > vulnerable.json
          jq -r '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]
                  | select(.vulnerabilities) | .vulnerabilities[] as $v
                  | "\($v.severity)\t\(.id) \(.resolvedVersion)\t\($v.advisoryurl)"] | unique | .[]' vulnerable.json \
            | tee vulnerability-report.txt
          if grep -qE '^(High|Critical)' vulnerability-report.txt; then
            echo "::error::High or critical vulnerable NuGet packages. Update them (or the package that pulls them in)."
            exit 1
          fi

      - name: Upload vulnerability report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dotnet-vulnerability-report
          path: vulnerability-report.txt
          retention-days: 30

  npm-security-scan:
    name: npm Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install pnpm
        # Corepack installs the pnpm version (and checks the hash) named in packageManager.
        # Also make it the global default: setup-node's pnpm cache asks for the store
        # path from the repo root, where no packageManager applies.
        run: |
          corepack enable
          corepack install --global "$(jq -r .packageManager src/ClercqIt.Web/package.json)"

      - name: Setup pnpm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: 'src/ClercqIt.Web/pnpm-lock.yaml'

      - name: Install dependencies
        working-directory: ./src/ClercqIt.Web
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        # Blocking on high and critical (issue #281). Reasoned exceptions are in
        # pnpm.auditConfig.ignoreGhsas (package.json), explained in docs/application-security.md.
        working-directory: ./src/ClercqIt.Web
        run: pnpm audit --audit-level=high

      - name: Generate audit report
        working-directory: ./src/ClercqIt.Web
        run: |
          pnpm audit --json > ../../npm-audit-report.json || true
          
      - name: Upload audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30
