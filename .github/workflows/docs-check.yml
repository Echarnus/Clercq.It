---
name: Docs check

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-check:
    name: Docs updated
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require docs changes alongside code, infra and workflow changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOCS_NOT_NEEDED: ${{ contains(github.event.pull_request.labels.*.name, 'docs:not-needed') }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA")
          echo "Changed files:"
          echo "$changed"

          needs_docs=$(echo "$changed" | grep -E '^(src/|infra/|tests/|\.github/(workflows|actions)/|\.claude/)' || true)
          has_docs=$(echo "$changed" | grep -E '^(docs/|CLAUDE\.md$|README\.md$)' || true)

          if [ -z "$needs_docs" ]; then
            echo "No code, infra or workflow changes; docs not required."
            exit 0
          fi
          if [ -n "$has_docs" ]; then
            echo "Docs updated:"
            echo "$has_docs"
            exit 0
          fi
          if [ "$DOCS_NOT_NEEDED" = "true" ]; then
            echo "Label docs:not-needed is set; the reason must be in the PR body."
            exit 0
          fi

          echo "::error::This PR changes code, infra or workflows but no file under docs/ (or CLAUDE.md/README.md)."
          echo "::error::Update the matching docs page, or add the docs:not-needed label with a reason in the PR body."
          exit 1
