---
name: Docs check

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-check:
    name: Docs updated
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require docs changes alongside code, infra and workflow changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DOCS_NOT_NEEDED: ${{ contains(github.event.pull_request.labels.*.name, 'docs:not-needed') }}
        run: |
          flag=""
          if [ "$DOCS_NOT_NEEDED" = "true" ]; then
            echo "Label docs:not-needed is set; the reason must be in the PR body."
            flag="--docs-not-needed"
          fi
          python3 .github/scripts/docs_check.py --base "$BASE_SHA" --head "$HEAD_SHA" $flag
