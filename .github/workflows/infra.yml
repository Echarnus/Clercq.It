---
name: Deploy Infra

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/**'
  workflow_dispatch:

env:
  TERRAFORM_VERSION: '1.6.0'
  TF_IN_AUTOMATION: true
  TF_INPUT: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive infrastructure/terraform/
        continue-on-error: true

      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init \
            -backend-config="access_key=$SCW_ACCESS_KEY" \
            -backend-config="secret_key=$SCW_SECRET_KEY"
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1
          TF_VAR_scaleway_organization_id: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          TF_VAR_scaleway_project_id: ${{ secrets.SCALEWAY_PROJECT_ID }}

      - name: Terraform Validate
        id: validate
        run: |
          cd infrastructure/terraform
          terraform validate

      - name: Terraform Plan
        id: plan
        run: |
          cd infrastructure/terraform
          terraform plan -no-color -out=tfplan 2>&1 | tee tfplan.txt
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1
          TF_VAR_scaleway_organization_id: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          TF_VAR_scaleway_project_id: ${{ secrets.SCALEWAY_PROJECT_ID }}
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE || 'echarnus/clercq-it:latest' }}
          TF_VAR_custom_domain: ${{ vars.CUSTOM_DOMAIN || '' }}

      - name: Comment PR
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan;
            try {
              plan = fs.readFileSync('infrastructure/terraform/tfplan.txt', 'utf8');
            } catch (err) {
              plan = 'Plan output not available';
            }
            
            const output = `
            #### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📋\`${{ steps.plan.outcome }}\`
            
            <details><summary>Show Plan</summary>
            
            \`\`\`hcl
            ${plan}
            \`\`\`
            
            </details>
            
            *Pushed by: @${{ github.actor }}*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

  terraform-deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    environment: 
      name: production
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Backend Bucket
        run: |
          cd infrastructure
          # Run the setup script to ensure backend bucket exists
          bash scripts/setup-backend.sh
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}

      - name: Terraform Init
        run: |
          cd infrastructure/terraform
          terraform init \
            -backend-config="access_key=$SCW_ACCESS_KEY" \
            -backend-config="secret_key=$SCW_SECRET_KEY"
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1
          TF_VAR_scaleway_organization_id: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          TF_VAR_scaleway_project_id: ${{ secrets.SCALEWAY_PROJECT_ID }}

      - name: Import Existing Resources
        continue-on-error: true
        run: |
          cd infrastructure/terraform
          echo "🔍 Checking for existing Scaleway resources..."
          
          # Initialize state if needed
          terraform state list > /dev/null 2>&1 || echo "State is empty or doesn't exist"
          
          # Check if namespace is already in state
          if terraform state show scaleway_container_namespace.portfolio > /dev/null 2>&1; then
            echo "✅ Namespace already in Terraform state, skipping import"
          else
            echo "📦 Namespace not in state, checking if it exists in Scaleway..."
            
            # Try to import the container namespace if it exists
            # Using jq for better JSON parsing (more reliable than grep)
            NAMESPACE_ID=$(curl -s -H "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/containers/v1beta1/regions/fr-par/namespaces" \
              | python3 -c "import sys, json; data = json.load(sys.stdin); print(next((ns['id'] for ns in data.get('namespaces', []) if ns['name'] == 'portfolio'), ''))" 2>/dev/null || echo "")
            
            if [ ! -z "$NAMESPACE_ID" ] && [ "$NAMESPACE_ID" != "" ]; then
              echo "📦 Found existing namespace with ID: $NAMESPACE_ID"
              echo "📥 Attempting to import into Terraform state..."
              if terraform import "scaleway_container_namespace.portfolio" "$NAMESPACE_ID"; then
                echo "✅ Successfully imported namespace"
              else
                echo "⚠️ Import failed, but continuing (might not exist or already imported)"
              fi
            else
              echo "ℹ️ No existing namespace found, will create new one"
            fi
          fi
          
          # Check if container is already in state
          if terraform state show scaleway_container.portfolio_app > /dev/null 2>&1; then
            echo "✅ Container already in Terraform state"
          else
            echo "📦 Container not in state, it will be created/imported during apply"
          fi
          
          echo ""
          echo "📊 Current Terraform state:"
          terraform state list || echo "State is empty"
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1
          TF_VAR_scaleway_organization_id: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          TF_VAR_scaleway_project_id: ${{ secrets.SCALEWAY_PROJECT_ID }}

      - name: Terraform Apply
        id: apply
        run: |
          cd infrastructure/terraform
          echo "🚀 Starting infrastructure deployment..."
          terraform apply -auto-approve -no-color
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCALEWAY_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
          SCW_DEFAULT_ZONE: fr-par-1
          TF_VAR_scaleway_organization_id: ${{ secrets.SCALEWAY_ORGANIZATION_ID }}
          TF_VAR_scaleway_project_id: ${{ secrets.SCALEWAY_PROJECT_ID }}
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE || 'echarnus/clercq-it:latest' }}
          TF_VAR_custom_domain: ${{ vars.CUSTOM_DOMAIN || '' }}

      - name: Terraform Output
        if: success()
        run: |
          cd infrastructure/terraform
          echo "## 🎉 Infrastructure Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Outputs:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          terraform output -json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
