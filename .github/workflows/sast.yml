---
name: SAST

# Blocking static analysis on every PR (issue #237): Semgrep, gitleaks and
# CodeQL (its own workflow until #485). Each fails its check on a finding;
# results also go to the Security tab.
# See docs/application-security.md#static-analysis-sast.

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly on Monday at 08:00 UTC, so new CodeQL queries also run on a quiet main
    - cron: '0 8 * * 1'
  workflow_dispatch:

# Read-only by default; the scan jobs ask for security-events: write (#397).
permissions:
  actions: read
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.182.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        # Blocking: ERROR severity from the registry packs and every rule in .semgrep/.
        run: |
          semgrep scan \
            --config p/csharp --config p/typescript --config p/react --config p/nextjs \
            --config p/owasp-top-ten --config p/secrets --config p/dockerfile --config p/terraform \
            --config .semgrep \
            --severity ERROR --metrics off --error \
            --sarif --output semgrep.sarif \
            --text-output semgrep.txt

      - name: Show findings
        if: always()
        run: cat semgrep.txt 2>/dev/null || true

      - name: Upload Semgrep results
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        # PRs: only the PR's own commits. main and manual runs: full history.
        # Known false positives are listed in .gitleaksignore with a reason.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            gitleaks git . --no-banner --redact --log-opts="origin/$BASE_REF..HEAD"
          else
            gitleaks git . --no-banner --redact
          fi

  analyze-csharp:
    name: Analyze C# Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          queries: +security-extended,security-and-quality

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Restore dependencies
        run: |
          cd src
          dotnet restore ClercqIt.Api/ClercqIt.Api.csproj --locked-mode

      - name: Build
        run: |
          cd src
          dotnet build ClercqIt.Api/ClercqIt.Api.csproj --no-restore --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:csharp"

  analyze-javascript:
    name: Analyze JavaScript/TypeScript Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: +security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"

  codeql-gate:
    name: CodeQL gate
    # Fails when the analysed ref has an open high or critical CodeQL alert.
    # A false positive is dismissed in the Security tab with a reason (issue #237).
    runs-on: ubuntu-latest
    needs: [analyze-csharp, analyze-javascript]
    if: github.event_name != 'schedule'
    permissions:
      security-events: read
    steps:
      - name: Check open high and critical alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.number) || github.ref }}
        run: |
          found=0
          for severity in critical high; do
            alerts=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/code-scanning/alerts?tool_name=CodeQL&state=open&severity=$severity&ref=$REF&per_page=100" \
              --jq '.[] | "\(.rule.security_severity_level // .rule.severity)  \(.rule.id)  \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)  \(.html_url)"')
            if [ -n "$alerts" ]; then
              echo "$alerts"
              found=1
            fi
          done
          if [ "$found" -eq 1 ]; then
            echo "::error::Open high or critical CodeQL alerts on $REF. Fix them, or dismiss a false positive in the Security tab with a reason."
            exit 1
          fi
          echo "No open high or critical CodeQL alerts on $REF"
