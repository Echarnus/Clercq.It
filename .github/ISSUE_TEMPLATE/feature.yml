name: Feature
description: New behaviour on the site, API or tooling
labels: ["type:feature", "status:ready"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed and what exists today.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What to build. Keep it small enough for one PR.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable outcomes, one per line as "- [ ] ...".
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Docs to update
      description: Which pages under docs/ change, or "none, because ...".
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [web, api, auth, infra, ci]
    validations:
      required: true
