mode: ContinuousDeployment
branches:
  main:
    regex: ^master$|^main$
    mode: ContinuousDeployment
    label: ''
    increment: Patch
  develop:
    regex: ^dev(elop)?(ment)?$
    mode: ContinuousDeployment
    label: 'alpha'
    increment: Minor
    source-branches: ['main']
  feature:
    regex: ^features?[/-]
    mode: ContinuousDeployment
    label: 'feature'
    increment: Inherit
    source-branches: ['develop', 'main']
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDeployment
    label: 'pr'
    increment: Inherit
  hotfix:
    regex: ^hotfix(es)?[/-]
    mode: ContinuousDeployment
    label: 'beta'
    increment: Patch
    source-branches: ['main']
  release:
    regex: ^releases?[/-]
    mode: ContinuousDeployment
    label: 'beta'
    increment: None
    source-branches: ['develop']
    is-release-branch: true
  support:
    regex: ^support[/-]
    mode: ContinuousDeployment
    label: ''
    increment: Patch
    source-branches: ['main']
ignore:
  sha: []
merge-message-formats: {}