# Trunk-based: main is the only long-lived branch and deploys to production.
# See docs/versioning.md.
mode: ContinuousDeployment
tag-prefix: '[vV]?'
branches:
  main:
    regex: ^master$|^main$
    mode: ContinuousDeployment
    label: ''
    increment: Patch
    prevent-increment:
      of-merged-branch: false
    track-merge-target: false
  feature:
    # Short-lived work branches: <type>/<issue>-<slug>, plus bot branches.
    regex: ^(feat|fix|chore|infra|content|docs|security|feature|copilot|claude|dependabot)[/-]
    mode: ContinuousDeployment
    label: '{BranchName}'
    increment: Inherit
    source-branches: ['main']
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    mode: ContinuousDeployment
    label: 'pr'
    increment: Inherit
    source-branches: ['main', 'feature']
ignore:
  sha: []
merge-message-formats: {}
